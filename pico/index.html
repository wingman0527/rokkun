<script>/* ===== PC_AU: 8bit の おと（自作の曲と こうかおん） =====

   ・パルス波（ギター／うた）・さんかく波（ベース）・ノイズ（ドラム）
   ・ふつうの AudioContext でも OfflineAudioContext（書き出し）でも 動く */
const PC_AU = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, revIn = null, ppIn = null;
  let muted = false, musicVol = 0.55, sfxVol = 0.75;
  const waves = {};
  let noiseBuf = null, metalBuf = null;

  /* ---------- 波形 ---------- */
  function pulseWave(c, duty) {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return c.createPeriodicWave(re, im);
  }
  function nesTriWave(c) {
    /* 4bit の かいだん さんかく波（むかしの ゲームきの ベースの ざらっと した おと） */

    const s = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const p = i / N, step = Math.floor(p * 32), v = step < 16 ? step : 31 - step;
      s[i] = v / 7.5 - 1;
    }
    for (let k = 1; k < H; k++) {
      let a = 0, b = 0;
      for (let i = 0; i < N; i++) { const t = 2 * Math.PI * k * i / N; a += s[i] * Math.cos(t); b += s[i] * Math.sin(t); }

    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);

    for (let i = 0; i < len; i++) {

  }

  }

  function setup(c) {

    { const n = 12, re = new Float32Array(n), im = new Float32Array(n); im[1] = 1; im[2] = 0.08; im[3] = 0.22; im[5] = 0.06; waves.bell = c.createPeriodicWave(re, im); }

    const comp = c.createDynamicsCompressor();

    comp.connect(master); master.connect(c.destination);
    musicBus = c.createGain(); musicBus.gain.value = musicVol; musicBus.connect(comp);
    sfxBus = c.createGain(); sfxBus.gain.value = sfxVol; sfxBus.connect(comp);
    /* うたの ディレイ（ギターの やまびこ） */
    delayIn = c.createGain(); delayIn.gain.value = 0.2;
    const dl = c.createDelay(1.0); dl.delayTime.value = 0.26;
    const fb = c.createGain(); fb.gain.value = 0.28;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    delayIn.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(musicBus);
    /* きれいな 音の ための リバーブ（つくった ひびき）と ピンポン ディレイ */
    const len = Math.floor(c.sampleRate * 1.5), ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let lpv = 0; for (let i = 0; i < len; i++) { const x = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); lpv += (x - lpv) * 0.35; d[i] = lpv; } }
    revIn = c.createGain(); revIn.gain.value = 1;
    const conv = c.createConvolver(); conv.buffer = ir; const rw = c.createGain(); rw.gain.value = 0.55;
    revIn.connect(conv); conv.connect(rw); rw.connect(comp);
    ppIn = c.createGain(); ppIn.gain.value = 1;
    const dL = c.createDelay(1.5), dR = c.createDelay(1.5), fL = c.createGain(), fR = c.createGain(), pL = c.createStereoPanner(), pR = c.createStereoPanner(), plp = c.createBiquadFilter();
    dL.delayTime.value = 0.349; dR.delayTime.value = 0.349; fL.gain.value = 0.33; fR.gain.value = 0.33; pL.pan.value = -0.7; pR.pan.value = 0.7; plp.type = 'lowpass'; plp.frequency.value = 3800;

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(() => {}); return true; }

    if (!AC) return false;

    return true;
  }

  const mf = m => 440 * Math.pow(2, (m - 69) / 12);

  /* ---------- こえ（ひとつの おと） ---------- */
  function tone(t, o) {
    /* o: {m, dur, vol, wave, bus, att, dec, sus, rel, vib, bend, slide, echo} */
    const c = ctx, osc = c.createOscillator(), g = c.createGain();
    if (o.wave === 'tri') osc.setPeriodicWave(waves.tri);
    else if (o.wave === 'sine') osc.type = 'sine';
    else osc.setPeriodicWave(waves[o.wave || 0.5]);

      osc.frequency.exponentialRampToValueAtTime(f, t + 0.07);

    if (o.slide) osc.frequency.exponentialRampToValueAtTime(mf(o.m + o.slide), t + o.dur);
    const v = o.vol, att = o.att ?? 0.004, dec = o.dec ?? 0.12, sus = o.sus ?? 0.7, rel = o.rel ?? 0.03;
    const end = t + Math.max(o.dur, att + 0.01);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + att);
    g.gain.setTargetAtTime(v * sus, t + att, dec / 3);
    g.gain.setValueAtTime(v * sus, end);
    g.gain.linearRampToValueAtTime(0.0001, end + rel);
    if (o.vib && o.dur > 0.22) {
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 5.8; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.012 * o.vib, t + 0.25);
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(end + rel + 0.02);
    }
    osc.connect(g); g.connect(o.bus || musicBus);
    if (o.echo) g.connect(delayIn);
    osc.start(t); osc.stop(end + rel + 0.02);
  }
  function noise(t, o) {
    /* o: {dur, vol, hp, bp, lp, q, metal, rate, bus} */
    const c = ctx, src = c.createBufferSource(), g = c.createGain();
    src.buffer = o.metal ? metalBuf : noiseBuf; src.loop = true;
    src.playbackRate.value = o.rate || 1;
    let node = src;
    const filt = (type, fr, q) => { const f = c.createBiquadFilter(); f.type = type; f.frequency.value = fr; if (q) f.Q.value = q; node.connect(f); node = f; };
    if (o.hp) filt('highpass', o.hp); if (o.bp) filt('bandpass', o.bp, o.q || 0.8); if (o.lp) filt('lowpass', o.lp);
    g.gain.setValueAtTime(o.vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
    node.connect(g); g.connect(o.bus || musicBus);
    src.start(t, Math.random() * 0.4); src.stop(t + o.dur + 0.02);
  }
  function kick(t, v = 0.9, bus) {
    const c = ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(bus || musicBus); o.start(t); o.stop(t + 0.22);
    noise(t, { dur: 0.02, vol: v * 0.25, lp: 3000, bus });
  }
  function snare(t, v = 0.6, bus) {
    noise(t, { dur: 0.16, vol: v, bp: 1900, q: 0.6, bus });
    noise(t, { dur: 0.08, vol: v * 0.5, hp: 5000, bus });
    tone(t, { m: 55, dur: 0.05, vol: v * 0.5, wave: 'tri', dec: 0.05, sus: 0.2, bus, slide: -7 });
  }
  function hat(t, v = 0.18, open, bus) { noise(t, { dur: open ? 0.22 : 0.035, vol: v, hp: 7500, metal: true, bus }); }
  function crash(t, v = 0.35, bus) { noise(t, { dur: 1.1, vol: v, hp: 4200, metal: true, rate: 0.9, bus }); noise(t, { dur: 0.6, vol: v * 0.5, hp: 6000, bus }); }
  function tom(t, m, v = 0.6, bus) { tone(t, { m, dur: 0.14, vol: v, wave: 'tri', dec: 0.1, sus: 0.3, slide: -9, bus }); }

  /* ---------- がくふ（ことばで かく） ---------- */
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function nm(s) {
    const r = /^([A-G])(#|b)?(-?\d)$/.exec(s); if (!r) throw new Error('note ' + s);
    return 12 * (+r[3] + 1) + NOTE[r[1]] + (r[2] === '#' ? 1 : r[2] === 'b' ? -1 : 0);
  }
  /* 1つの ことば＝8ぶおんぷ。"-"＝のばす "."＝やすみ "A+B"＝16ぶ 2つ "^"＝ギターの チョーキング */
  function parseLine(str, startStep) {
    const out = []; let step = startStep, last = null;
    for (const tok of str.trim().split(/\s+/)) {
      const parts = tok.split('+');
      const sub = parts.length === 1 ? 2 : 1;
      for (const p of parts) {
        if (p === '-') { if (last) last.len += sub; }
        else if (p === '.') { last = null; }
        else {
          let bend = 0, q = p;
          if (q[0] === '^') { bend = -2; q = q.slice(1); }

    return { pc, minor: r[3] === 'm' };

  function third(m, scale) {

  /* 曲を くみたてる: sections = [{bars, chords:[...], lead, harm, gtr, bass, drums}] */
  function buildSong(def) {
    const ev = []; let bar0 = 0;
    for (const sec of def.sections) {
      const nb = sec.chords.length, base = bar0 * 16;
      if (sec.lead) for (const n of parseLine(sec.lead, base)) {
        ev.push({ s: n.step, k: 'lead', m: n.m + (sec.leadOct || 0) * 12, len: n.len, bend: n.bend, v: sec.leadVol || 1 });
        if (sec.harm && n.step >= base + sec.harm * 16) ev.push({ s: n.step, k: 'harm', m: third(n.m, E_MAJ), len: n.len });

        let rootG = 48 + pc; if (rootG < 50) rootG += 12;  /* D3〜C#4 */

          if (bs === 'drive' && i === 14) m = rootB + 12;
          if (bs === 'walk' && i === 14 && bi < nb - 1) { const nx = chordRoot(sec.chords[bi + 1]).pc; let nr = 36 + nx; if (nr < 40) nr += 12; m = nr + (nr > rootB ? -1 : 1); }
          if (bs === 'half' && i % 8 !== 0) continue;
          ev.push({ s: s0 + i, k: 'bass', m, len: bs === 'half' ? 7 : 2 });

        const gs = Array.isArray(sec.gtr) ? sec.gtr[bi] : (sec.gtr || 'chug');
        if (gs === 'chug') for (let i = 0; i < 16; i += 2) ev.push({ s: s0 + i, k: 'pc', m: rootG, len: 1, mute: true });
        else if (gs === 'trem') for (let i = 0; i < 16; i++) ev.push({ s: s0 + i, k: 'pc', m: rootG, len: 1, acc: i % 4 === 0 });
        else if (gs === 'hold') ev.push({ s: s0, k: 'pc', m: rootG, len: 15, hold: true });
        else if (gs === 'arp') {
          const third3 = minor ? 3 : 4;

          pat.forEach((iv, j) => ev.push({ s: s0 + j * 2, k: 'arp', m: rootG + iv, len: 2 }));
        }

        if (dr) {

  }

  const DRUMS = {
    beat:   { K: 'x.......x.x.....', S: '....x.......x...', H: 'x.x.x.x.x.x.x.x.' },
    beatB:  { K: 'x.....x.x.....x.', S: '....x.......x...', H: 'x.x.x.x.x.x.x.x.' },
    verse:  { K: 'x.....x.x.......', S: '....x.......x...', H: 'x.x.x.x.x.x.x.x.' },
    four:   { K: 'x...x...x...x...', S: '....x.......x...', H: 'x.x.x.x.x.x.x.x.' },
    snare4: { K: 'x...x...x...x...', S: 'x...x...x...x...', H: 'x.x.x.x.x.x.x.x.' },
    roll:   { K: 'x...x...x...x...', S: 'x.x.x.x.xxxxxxxx', H: '' },
    chorus: { K: 'x.....x.x.....x.', S: '....x.......x...', O: '..x...x...x...x.', H: 'x...x...x...x...' },
    fill:   { K: 'x.....x.x.......', S: '....x.......x.xx', T: '........xx......', t: '..........xx....' },
    fillB:  { K: 'x.....x.x.......', S: '....x...xxxxxxxx' },
    light:  { K: 'x.......x.......', S: '....x.......x...', H: 'x.x.x.x.x.x.x.x.' },

    boss:   { K: 'x.x...x.x.x...x.', S: '....x.......x...', H: 'x.x.x.x.x.x.x.x.' },
    bossF:  { K: 'x.x...x.x.......', S: '....x...x.xxxxxx', T: '' },
    none:   {}

  /* ===== 曲 1「はしれ！ ピコピコ ロード」（ステージの 曲・172BPM・ホ長調） ===== */

      lead: 'B5 - G#5 - F#5 E5 F#5 G#5  F#5 - - - D#5 E5 F#5 -  B5 - G#5 - F#5 E5 F#5 G#5  ^C#6 - B5 - G#5 - - -  ' +
            'B5 - G#5 - F#5 E5 F#5 G#5  F#5 - - - E5 F#5 G#5 -  E5 - - D#5 E5 - F#5 G#5  F#5 - - - - - . .',
      gtr: ['trem', 'trem', 'trem', 'trem', 'arp', 'arp', 'arp', 'trem'], bass: 'eight',
      drums: ['beatB', 'beatB', 'beatB', 'beatB', 'beat', 'beat', 'beat', 'fill']

    verse: {

      lead: '. G#4 G#4 G#4 G#4 F#4 E4 F#4  G#4 - F#4 - D#4 - . .  . G#4 G#4 G#4 B4 G#4 F#4 E4  F#4 - - - . . . B3  ' +
            '. E4 E4 F#4 G#4 - A4 -  B4 - G#4 - E4 - . E4  F#4 G#4 A4 - G#4 F#4 E4 F#4  D#4 - - - . . . .',
      leadOct: 1, leadVol: 0.85, gtr: 'chug', bass: 'eight',
      drums: ['verse', 'verse', 'verse', 'verse', 'verse', 'verse', 'verse', 'fillB']
    },
    pre: {
      chords: ['F#m', 'G#m', 'A', 'B'],
      lead: '. A4 A4 A4 B4 A4 G#4 F#4  . B4 B4 B4 C#5 B4 G#4 F#4  . C#5 C#5 C#5 E5 C#5 B4 C#5  D#5 - - - F#5 - D#5 -',
      leadOct: 1, leadVol: 0.85, gtr: ['chug', 'trem', 'trem', 'trem'], bass: 'eight', crash: false,
      drums: ['four', 'four', 'snare4', 'roll']
    },
    chorus: {
      chords: ['A', 'B', 'G#m', 'C#m', 'A', 'B', 'E', 'E'],
      lead: '^E5 - - F#5 G#5 - B5 -  B5 - A5 G#5 F#5 - G#5 -  G#5 - - F#5 E5 - D#5 -  E5 - - - B4 - C#5 D#5  ' +

  /* ================= だい2しょう おやつ こうじょう =================

  const fogLeft = (G, base) => G.flags.daeki ? base * Math.max(0, 1 - (G.t - (G.fogT ?? -99999)) / 150) : base;
  function zGlyph(b, x, y, a) { /* ねむって いる しるしの Z（3x3 の ドット） */
    b.globalAlpha = Math.max(0, Math.min(1, a)); b.fillStyle = '#ffffff';
    for (const [i, j] of [[0, 0], [1, 0], [2, 0], [1, 1], [0, 2], [1, 2], [2, 2]]) b.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
    b.globalAlpha = 1;
  }
  function snackBit(b, x, y, k) { /* ベルトに のって いる ちいさな おかし */
    x = Math.round(x); y = Math.round(y); b.fillStyle = '#2a1a3e';
    if (k === 0) { b.fillRect(x - 3, y - 3, 7, 6); b.fillStyle = '#d89850'; b.fillRect(x - 2, y - 2, 5, 4); b.fillStyle = '#a86830'; b.fillRect(x - 1, y - 1, 1, 1); b.fillRect(x + 1, y, 1, 1); }
    else if (k === 1) { b.fillRect(x - 4, y - 2, 9, 5); b.fillStyle = '#ff7898'; b.fillRect(x - 3, y - 1, 7, 3); b.fillStyle = '#ffffff'; b.fillRect(x - 1, y - 1, 1, 1); }
    else { b.fillRect(x - 3, y - 3, 6, 6); b.fillStyle = '#fce060'; b.fillRect(x - 2, y - 2, 4, 4); b.fillStyle = '#fff4b0'; b.fillRect(x - 2, y - 2, 2, 1); }
  }

  function drawSunset(b, cx, cy, G) {
    const top = -cy, bands = ['#4c2c78', '#6c3888', '#9c4890', '#d0608c', '#f08878', '#fcb070', '#fcd890'];
    bands.forEach((c, i) => { b.fillStyle = c; b.fillRect(0, top + i * 8, 320, 8); });
    for (let i = 1; i < bands.length; i++) { b.fillStyle = bands[i]; for (let x = i % 2; x < 320; x += 2) b.fillRect(x, top + i * 8 - 1, 1, 1); }
    b.fillStyle = '#f0e0ff'; for (let i = 0; i < 16; i++) b.fillRect((i * 83 + 11) % 320, top + (i * 29) % 18 + 1, 1, 1);
    const sx = Math.round(176 - cx * 0.2), sy = top + 44; /* おひさま（はんぶん しずむ） */
    for (let j = -12; j <= 0; j++) { const w = Math.round(Math.sqrt(144 - j * j)); b.fillStyle = j > -3 ? '#ffe8a0' : '#fff4c8'; b.fillRect(sx - w, sy + j, w * 2, 1); }
    const off = Math.round(-cx * 0.3), hz = top + 46;
    b.fillStyle = '#f4a0a8'; b.fillRect(0, hz - 2, 320, 20); /* だえきの うみ（ゆうひの いろ） */
    b.fillStyle = '#ffd8b0'; for (let i = 0; i < 10; i++) b.fillRect(((i * 41 + off) % 360 + 360) % 360 - 20, hz + 2 + (i % 3) * 4, 6 + (i % 2) * 4, 1);
    b.fillStyle = '#d07090'; b.fillRect(4 + off, hz - 4, 108, 4); /* まえばの はま（はぐきと まるい はの かげ） */
    for (const [x, w, h] of [[12, 14, 13], [28, 14, 15], [46, 12, 11], [60, 12, 12], [76, 14, 14], [92, 12, 11]]) sunTooth(b, x + off, hz - 4 - h, w, h);
    b.fillStyle = '#b05888'; for (let i = 0; i < 160; i++) { const hh = 6 + Math.round(Math.sin(i * 0.045) * 3); b.fillRect(214 + off + i, hz - hh, 1, hh); } /* はぐきの おかと ハブラシの もり */
    for (let i = 0; i < 12; i++) sunBrush(b, 222 + off + i * 12 + (i % 2) * 3, hz - 7 - (i % 3), 8 + ((i * 5) % 3) * 2);
  }
  function sunTooth(b, x, y, w, h) { b.fillStyle = '#f8d4dc'; b.fillRect(x + 1, y, w - 2, h); b.fillRect(x, y + 1, w, h - 1); b.fillStyle = '#e8b0c0'; b.fillRect(x + w - 3, y + 1, 2, h - 1); b.fillStyle = '#fff0f4'; b.fillRect(x + 2, y + 2, 2, h - 5); }
  function sunBrush(b, x, base, h) { b.fillStyle = '#5c78b0'; b.fillRect(x + 3, base - h, 2, h); b.fillStyle = '#9cd8c4'; b.fillRect(x, base - h - 5, 8, 4); b.fillStyle = '#e8f8f0'; for (let i = 0; i < 8; i += 2) b.fillRect(x + i, base - h - 7, 1, 2); b.fillStyle = '#6cb8a4'; b.fillRect(x, base - h - 2, 8, 1); }

  const YZ = {};

          let best = d.lane; const sc = l => (danger(l) ? -10 : 0) + (good(l) ? 3 : 0) - Math.abs(l - d.lane) * 0.5;
          for (const l of lanes) if (sc(l) > sc(best)) best = l;
          if (best < d.lane && st.pk % 3 === 0) I.leftP = true; if (best > d.lane && st.pk % 3 === 0) I.rightP = true;
          return I;
        }
        tapA(); return I;
      }
      if (G.bg) { const g = G.bg; if (g.pause === 0 && Math.abs(g.p - g.z) < 2.5) I.aP = true; return I; }
      if (G.flossG) { if (st.pk % 7 === 0) { if (G.flossG.side !== -1) I.leftP = true; else I.rightP = true; } return I; }
      if (G.cred) { I.a = true; return I; }
      if (G.nameG) { /* じぶんで なまえを いれる ときは「ロ」「ク」→ おわり */
        const g = G.nameG, want = g.name.length === 0 ? [4, 9] : g.name.length === 1 ? [1, 2] : [8, 1];
        if (g.r !== want[0]) { if (st.pk % 4 === 0) I.downP = true; } else if (g.c !== want[1]) { if (st.pk % 4 === 0) I.rightP = true; } else if (st.pk % 6 === 0) I.aP = true;
        return I;
      }
      if (G.sc) {
        if (G.choice) {
          const o = G.choice.opts.join('|');
          let want = 0;
          if (o.includes('うがい')) want = st.tried.ugai ? 1 : 0;
          if (o.includes('いまは ちょっと')) want = st.tried.notnow ? 0 : 1;
          if (o.includes('じぶんで きめる')) want = st.ownName ? 3 : 0;
          if (o.includes('……いやだ')) want = st.iyada ? 1 : 0;
          if (G.choice.sel !== want) { if (st.pk % 4 === 0) I.downP = true; }
          else if (st.pk % 6 === 0) { I.aP = true; if (o.includes('うがい') && want === 0) st.tried.ugai = 1; if (o.includes('いまは ちょっと') && want === 1) st.tried.notnow = 1; }
          return I;
        }
        tapA(); return I;
      }
      const gl = goal(G); if (!gl) return I;
      if (gl.chase) { const e = A.actor(gl.chase); if (e && !e.gone) { gl.tx = Math.floor(e.x / 16); gl.ty = Math.floor((e.y - 3) / 16); } }
      const P = G.P, cx = Math.floor(P.x / 16), cy = Math.floor((P.y - 3) / 16);
      if (cx === gl.tx && cy === gl.ty) {
        if (gl.face && P.dir !== gl.face) { I[{ u: 'up', d: 'down', l: 'left', r: 'right' }[gl.face]] = true; return I; }
        if (gl.act && st.pk % 10 === 0) I.aP = true;
        if (!gl.act) I.down = true;
        return I;
      }
      if (!st.path || st.pk % 20 === 0) st.path = window._dbg.path(gl.tx, gl.ty);
      const p = st.path; if (!p || p.length < 2) { I.right = true; return I; }
      let nx = p[1];
      for (let i = 0; i < p.length; i++) if (p[i][0] === cx && p[i][1] === cy) { nx = p[Math.min(p.length - 1, i + 1)]; break; }
      const tx = nx[0] * 16 + 8, ty = nx[1] * 16 + 11;
      if (tx > P.x + 1) I.right = true; if (tx < P.x - 1) I.left = true; if (ty > P.y + 1) I.down = true; if (ty < P.y - 1) I.up = true;
      return I;
    };
  }

  window.addEventListener('load', () => RG.boot(content));
})();
