:root{
  --night:#1b1036; --night2:#22124a; --line:#2a1a3e; --deep:#0e0820; --tooth:#fffaf0; --dim:#b9aee6;
  --pink:#ff7898; --sky:#80dcfc; --star:#fce060; --leaf:#5cd878; --gum:#fc94b0;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;min-height:100vh;color:var(--tooth);font:16px/1.6 'DotGothic16','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  background-color:var(--night);
  background-image:radial-gradient(#fce06099 1px,transparent 1.2px),radial-gradient(#ffffff66 1px,transparent 1.2px);
  background-size:97px 89px,61px 53px;background-position:13px 21px,40px 7px;
  -webkit-tap-highlight-color:transparent;padding:0 var(--safe-r) 0 var(--safe-l);word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
body.has-mini{padding-bottom:calc(76px + var(--safe-b))}
body.np-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
svg{width:16px;height:16px;fill:currentColor;flex:none;shape-rendering:crispEdges}
h1,h2,h3,p{margin:0;font-weight:400}
#app{max-width:560px;margin:0 auto;padding:0 16px 24px}

/* うえの おび */
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 0 12px;position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--night) 78%,transparent)}
.top h1{flex:1;font-size:20px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:36px;height:32px;display:grid;place-items:center}
.logo canvas{width:36px;height:32px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:4px;color:var(--tooth)}
.ibtn svg{width:20px;height:20px}
.ibtn:active{background:#ffffff14}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:var(--star);color:var(--line);border:3px solid var(--line);
  box-shadow:3px 3px 0 var(--deep);border-radius:4px;font-size:16px;min-height:44px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--deep)}
.btn.ghost{background:#2e1f5e;color:var(--tooth);border-color:#4e3d8e}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* カセット（アルバム） */
.cart{position:relative;display:flex;flex-direction:column;align-items:center;background:var(--shell);color:var(--ink);
  border:3px solid var(--line);border-radius:14px 14px 4px 4px;box-shadow:4px 4px 0 var(--deep);padding:8px 8px 12px;text-align:center}
.cart::after{content:'';position:absolute;bottom:-3px;left:50%;width:38%;height:6px;transform:translateX(-50%);background:var(--line);border-radius:2px 2px 0 0}
.cart .grip{width:62%;height:9px;margin:2px 0 7px;background:repeating-linear-gradient(to bottom,#0000002e 0 2px,transparent 2px 4px)}
.cart .label{background:var(--label);border:3px solid var(--line);padding:5px;border-radius:2px}
.cart-t{font-size:14px;line-height:1.4;margin-top:8px;min-height:2.8em;display:flex;align-items:center}
.cart-n{font-size:12px;opacity:.8}
button.cart:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--deep)}

/* はじめの がめん */
.hero{display:flex;gap:18px;align-items:center;margin:4px 0 18px;padding:16px;background:#2a1a5ecc;border:3px solid #4e3d8e;border-radius:6px}
.hero .cart-big{--ink:#2a1a3e;cursor:pointer;flex:none}
.hero-t{min-width:0}
.hero-t h2{font-size:24px;line-height:1.3;color:var(--star);margin-bottom:6px}
.hero-t p{font-size:14px;color:var(--dim);margin-bottom:12px}
@media (max-width:430px){ .hero{flex-direction:column;text-align:center} .hero .row{justify-content:center} }
.favrow{margin:0 0 20px}
.favcard{width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;background:#2e1f5e;border:3px solid #4e3d8e;border-radius:6px;text-align:left}
.favcard .star{width:40px;height:40px;display:grid;place-items:center;background:var(--line);border-radius:4px;color:var(--star)}
.favcard .star svg{width:24px;height:24px}
.favcard b{font-weight:400;display:block;font-size:16px}
.favcard small{font-size:13px;color:var(--dim)}
.shelf h3{font-size:16px;color:var(--sky);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:520px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.foot{margin:26px 0 8px;display:flex;justify-content:center}

/* アルバムの がめん */
.al-top{display:flex;gap:16px;align-items:center;margin:2px 0 12px}
.al-top .cart{flex:none}
.al-t h2{font-size:22px;line-height:1.35}
.al-t .sub{font-size:13px;color:var(--dim);margin-top:4px}
.about{font-size:14px;color:var(--dim);margin:0 0 14px;max-width:34em}
.al-btns{margin:0 0 10px}
.trks{list-style:none;margin:0;padding:0}
.trk{display:flex;align-items:center;border-bottom:2px dashed #3d2d72}
.trk-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 4px;text-align:left}
.trk-no{width:26px;flex:none;color:var(--sky);font-size:14px;text-align:right}
.trk-t{flex:1;min-width:0}
.trk-name{display:block;font-size:16px;line-height:1.4}
.trk-note{display:block;font-size:12px;color:var(--dim);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk-len{font-size:13px;color:var(--dim);flex:none}
.trk.on .trk-name{color:var(--pink)}
.fav{width:44px;height:44px;display:grid;place-items:center;color:#4b3b86;flex:none}
.fav svg{width:18px;height:18px}
.fav.is{color:var(--star)}
.empty{color:var(--dim);margin:30px 0;text-align:center}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq b{width:3px;background:var(--pink);height:4px}
body.is-playing .eq b{animation:eq .6s steps(3) infinite alternate}
.eq b:nth-child(2){animation-delay:-.2s} .eq b:nth-child(3){animation-delay:-.4s}
@keyframes eq{from{height:3px}to{height:14px}}

/* した の プレイヤー */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--line);border-top:3px solid var(--deep);padding:0 calc(10px + var(--safe-r)) var(--safe-b) calc(10px + var(--safe-l))}
#mini .bar{position:absolute;left:0;top:-3px;height:3px;background:var(--pink);width:0}
#mini .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px;height:72px}
#mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;height:100%}
#mini-c canvas{border:2px solid var(--deep)}
#mini-open span{min-width:0}
#mini-t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
#mini-a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--dim)}
#mini.wait #mini-a::before{content:'よういちゅう… '}
.pp{width:48px;height:48px;display:grid;place-items:center;background:var(--star);color:var(--line);border:3px solid var(--deep);border-radius:4px}
.pp svg{width:20px;height:20px}
#mini-next{width:44px;height:44px;display:grid;place-items:center}

/* いま ながれて いる きょく */
#np{position:fixed;inset:0;z-index:30;background:var(--night);transform:translateY(102%);visibility:hidden;transition:transform .22s steps(6),visibility 0s linear .22s;overflow-y:auto;
  padding:calc(6px + var(--safe-t)) calc(16px + var(--safe-r)) calc(18px + var(--safe-b)) calc(16px + var(--safe-l))}
#np.open{transform:none;visibility:visible;transition:transform .22s steps(6)}
#np .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
#np .bar{display:flex;align-items:center;justify-content:space-between;height:52px}
#np .bar p{font-size:13px;color:var(--dim)}
.stage{position:relative;border:3px solid var(--line);box-shadow:4px 4px 0 var(--deep);background:var(--line);border-radius:4px;overflow:hidden}
#viz{width:100%;aspect-ratio:160/132;height:auto}
.lanes{position:absolute;left:4px;bottom:4px;display:grid;gap:0;pointer-events:none}
#np-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#1b1036e6;text-align:center;padding:16px}
#np-load[hidden]{display:none}
#np-load .meter{width:72%;height:14px;border:3px solid var(--tooth);padding:2px}
#np-load .meter i{display:block;height:100%;width:0;background:var(--star)}
#np-load-t{font-size:14px}
#np-tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:#1b1036cc;font-size:18px;color:var(--star)}
#np-tap[hidden]{display:none}
.np-meta{display:flex;align-items:flex-start;gap:8px;margin:16px 0 4px}
.np-meta div{flex:1;min-width:0}
#np-t{font-size:22px;line-height:1.35}
#np-a{font-size:14px;color:var(--sky);margin-top:2px}
#np-m{font-size:13px;color:var(--dim);margin-top:4px}
.seek{margin:12px 0 2px}
#np-seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
#np-seek::-webkit-slider-runnable-track{height:8px;border:2px solid var(--tooth);background:linear-gradient(90deg,var(--pink) var(--p,0%),transparent var(--p,0%))}
#np-seek::-moz-range-track{height:8px;border:2px solid var(--tooth);background:linear-gradient(90deg,var(--pink) var(--p,0%),transparent var(--p,0%))}
#np-seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;background:var(--star);border:2px solid var(--line)}
#np-seek::-moz-range-thumb{width:14px;height:14px;background:var(--star);border:2px solid var(--line);border-radius:0}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.ctl .ibtn svg{width:24px;height:24px}
.ctl .pp{width:72px;height:72px}
.ctl .pp svg{width:30px;height:30px}
.ctl .small{color:#6f5fb0}
.ctl .small.is{color:var(--sky)}
#np-rep[data-mode="one"]::after{content:'1';position:absolute;font-size:11px;margin:16px 0 0 18px;color:var(--star)}
#np-rep{position:relative}
.upnext{margin:6px 0 0;font-size:13px;color:var(--dim);text-align:center;min-height:1.6em}
.upnext b{font-weight:400;color:var(--tooth)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:10px;height:4px;margin-right:5px;vertical-align:middle}

/* せってい */
#set{position:fixed;inset:0;z-index:40;background:#0e0820b3;display:flex;align-items:flex-end;justify-content:center;padding:16px}
#set[hidden]{display:none}
#set .box{width:100%;max-width:520px;background:var(--night2);border:3px solid #4e3d8e;border-radius:6px;padding:18px 18px calc(18px + var(--safe-b))}
#set h2{font-size:18px;margin-bottom:10px}
#set .opts{display:flex;gap:8px;margin:8px 0 12px}
#set .opts button{flex:1;min-height:48px;border:3px solid #4e3d8e;border-radius:4px;background:#2e1f5e}
#set .opts button.is{background:var(--star);color:var(--line);border-color:var(--line)}
#set p{font-size:13px;color:var(--dim);margin-bottom:10px}
#set .about{display:block;min-height:44px;padding:10px 0;margin-bottom:6px;color:var(--sky);font-size:15px;text-underline-offset:4px}
#set .ver{font-size:12px;color:#8f84c4}
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);z-index:50;background:var(--tooth);color:var(--line);border:3px solid var(--line);padding:10px 14px;max-width:90vw;font-size:14px}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){ #np{transition:none} body.is-playing .eq b{animation:none;height:10px} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<div id="mini" hidden>
  <i class="bar" id="mini-bar"></i>
  <div class="in">
    <button id="mini-open" aria-label="いま ながれて いる きょくを ひらく"><span id="mini-c"></span><span><span id="mini-t"></span><span id="mini-a"></span></span></button>
    <button class="pp" aria-label="ながす"></button>
    <button id="mini-next" aria-label="つぎの きょく" data-icon="next"></button>
  </div>
</div>

<section id="np" aria-hidden="true" aria-label="いま ながれて いる きょく">
  <div class="in">
    <div class="bar"><button class="ibtn" id="np-close" aria-label="とじる" data-icon="down"></button><p>いま ながれて いる きょく</p><span style="width:44px"></span></div>
    <div class="stage">
      <canvas id="viz" class="px" aria-hidden="true"></canvas>
      <div id="np-load" hidden><p id="np-load-t">きょくを よういして いるよ…</p><div class="meter"><i id="np-load-p"></i></div></div>
      <button id="np-tap" hidden data-icon="play" data-text="タップして ながす"></button>
    </div>
    <div class="legend" aria-hidden="true"><span><i style="background:#ff7898"></i>うた</span><span><i style="background:#fce060"></i>ギター</span><span><i style="background:#80dcfc"></i>ベース</span><span><i style="background:#5cd878"></i>ドラム</span></div>
    <div class="np-meta"><div><h2 id="np-t">　</h2><p id="np-a"></p><p id="np-m"></p></div><button class="fav" id="np-fav" aria-pressed="false" aria-label="すきな きょくに いれる" data-icon="star"></button></div>
    <div class="seek"><input id="np-seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="ながれて いる ところ"><div class="times"><span id="np-cur">0:00</span><span id="np-len">0:00</span></div></div>
    <div class="ctl">
      <button class="ibtn small" id="np-shuf" aria-label="まぜて きく" aria-pressed="false" data-icon="shuffle"></button>
      <button class="ibtn" id="np-prev" aria-label="まえの きょく" data-icon="prev"></button>
      <button class="pp" aria-label="ながす"></button>
      <button class="ibtn" id="np-next" aria-label="つぎの きょく" data-icon="next"></button>
      <button class="ibtn small" id="np-rep" aria-label="ぜんぶ くりかえす" data-icon="repeat"></button>
    </div>
    <p class="upnext" id="np-next-t"></p>
  </div>
</section>

<div id="set" hidden role="dialog" aria-modal="true" aria-labelledby="set-h">
  <div class="box">
    <h2 id="set-h">きく ながさ</h2>
    <div class="opts"><button data-len="short">みじかめ</button><button data-len="mid">ふつう</button><button data-len="long">ながめ</button></div>
    <p>ゲームの きょくは くりかえしで できて いるので、なんかい くりかえすかを えらべるよ。ながめに すると、よういに すこし じかんが かかるよ。</p>
    <p>どの きょくも ゲームと おなじ しくみで、この スマホの なかで おとを つくって います。はじめて きく きょくは よういに すこし じかんが かかります。</p>
    <a class="about" href="about.html">おうちの かたへ（この アプリに ついて）</a>
    <p class="ver">v1.0・build e33eff8a</p>
    <button class="btn" id="set-close">とじる</button>
  </div>
</div>
<p id="toast" hidden role="status"></p>
<audio id="au" preload="auto" playsinline></audio>
<script>
/* ===== RU: 書き出しの たすけ =====
   ・JANITOR: おわった ノートの ノードを つぎつぎ はずす（OfflineAudioContext に のこった ノードが ふえると とても おそく なるため）
     ノートの あいだに つくられた ノードに しるしを つけ、ずっと ある ノード（バス・エフェクト）へ つないだ ところを
     「じかんが すぎたら はずす」リストに いれる。 */
const RU = (() => {
  const FACT = ['createOscillator', 'createGain', 'createBiquadFilter', 'createBufferSource', 'createStereoPanner', 'createWaveShaper', 'createDelay', 'createConstantSource'];
  function janitor(oc) {
    const NOTE = new WeakSet();
    let on = false, cur = [], expire = 0;
    const lists = [];
    for (const f of FACT) {
      const orig = BaseAudioContext.prototype[f];
      if (!orig) continue;
      oc[f] = function (...a) { const n = orig.apply(this, a); if (on) NOTE.add(n); return n; };
    }
    const proto = AudioNode.prototype, origConnect = proto.connect;
    proto.connect = function (dest, ...a) {
      const r = origConnect.call(this, dest, ...a);
      if (on && NOTE.has(this) && dest instanceof AudioNode && !NOTE.has(dest)) cur.push(this);
      return r;
    };
    return {
      begin(expireAt) { on = true; cur = []; expire = expireAt; },
      end() { on = false; if (cur.length) lists.push({ at: expire, nodes: cur }); cur = []; },
      sweep(now) {
        let n = 0;
        for (let i = lists.length - 1; i >= 0; i--) if (lists[i].at < now) { for (const x of lists[i].nodes) { try { x.disconnect(); } catch (e) {} n++; } lists.splice(i, 1); }
        return n;
      },
      done() { proto.connect = origConnect; for (const f of FACT) delete oc[f]; }
    };
  }
  /* 16bit の WAV（モノラルに できる ときは モノラル）。gain で おおきさを そろえる */
  function toWav(buffer, gain = 1) {
    const ch0 = buffer.getChannelData(0), ch1 = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : ch0;
    let mono = true; for (let i = 0; i < ch0.length; i += 97) if (Math.abs(ch0[i] - ch1[i]) > 1e-6) { mono = false; break; }
    const nch = mono ? 1 : 2, n = ch0.length, sr = buffer.sampleRate;
    const ab = new ArrayBuffer(44 + n * nch * 2), v = new DataView(ab);
    const wr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    wr(0, 'RIFF'); v.setUint32(4, 36 + n * nch * 2, true); wr(8, 'WAVE'); wr(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, nch, true); v.setUint32(24, sr, true); v.setUint32(28, sr * nch * 2, true);
    v.setUint16(32, nch * 2, true); v.setUint16(34, 16, true); wr(36, 'data'); v.setUint32(40, n * nch * 2, true);
    const out = new Int16Array(ab, 44, n * nch);
    if (mono) for (let i = 0; i < n; i++) { let x = ch0[i] * gain; x = x > 1 ? 1 : x < -1 ? -1 : x; out[i] = x * 32767 | 0; }
    else for (let i = 0, j = 0; i < n; i++) { let a = ch0[i] * gain, b = ch1[i] * gain; a = a > 1 ? 1 : a < -1 ? -1 : a; b = b > 1 ? 1 : b < -1 ? -1 : b; out[j++] = a * 32767 | 0; out[j++] = b * 32767 | 0; }
    return { blob: new Blob([ab], { type: 'audio/wav' }), mono, bytes: ab.byteLength };
  }
  /* おおきさを しらべる（きこえる ところの RMS と ピーク） */
  function level(buffer) {
    const a = buffer.getChannelData(0), b = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : a;
    let pk = 0, ss = 0, cnt = 0; const W = 2048;
    for (let i = 0; i < a.length; i += W) {
      let s = 0; const e = Math.min(a.length, i + W);
      for (let j = i; j < e; j++) { const x = (a[j] + b[j]) * 0.5; s += x * x; const m = Math.max(Math.abs(a[j]), Math.abs(b[j])); if (m > pk) pk = m; }
      const r = s / (e - i); if (r > 1e-6) { ss += r; cnt++; }
    }
    return { peak: pk, rms: cnt ? Math.sqrt(ss / cnt) : 0 };
  }
  return { janitor, toWav, level };
})();

/* ===== PCAU: 8ビットの おと（ろっくん3・ろっくん1.5 と おなじ 音源）＋ おんがくばこ用の 書き出し =====
   ・曲は すべて 自作（メロディ・コードとも オリジナル）
   ・パルス波（ギター／うた）・さんかく波（ベース）・ノイズ（ドラム）
   ・ふつうの AudioContext でも OfflineAudioContext（書き出し）でも 動く */
const makePCAU = () => (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, revIn = null, ppIn = null;
  let muted = false, musicVol = 0.55, sfxVol = 0.75;
  const waves = {};
  let noiseBuf = null, metalBuf = null;

  /* ---------- 波形 ---------- */
  function pulseWave(c, duty) {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return c.createPeriodicWave(re, im);
  }
  function nesTriWave(c) {
    /* 4bit の かいだん さんかく波（むかしの ゲームきの ベースの ざらっと した おと） */
    const N = 1024, H = 40, re = new Float32Array(H), im = new Float32Array(H);
    const s = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const p = i / N, step = Math.floor(p * 32), v = step < 16 ? step : 31 - step;
      s[i] = v / 7.5 - 1;
    }
    for (let k = 1; k < H; k++) {
      let a = 0, b = 0;
      for (let i = 0; i < N; i++) { const t = 2 * Math.PI * k * i / N; a += s[i] * Math.cos(t); b += s[i] * Math.sin(t); }
      re[k] = 2 * a / N; im[k] = 2 * b / N;
    }
    return c.createPeriodicWave(re, im);
  }
  function makeNoise(c) {
    const len = Math.floor(c.sampleRate * 1.0);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    let r = 1; /* 15bit LFSR（むかしの ゲームきの ノイズの しくみ） */
    const per = Math.max(1, Math.floor(c.sampleRate / 32000));
    let v = 1;
    for (let i = 0; i < len; i++) {
      if (i % per === 0) { const bit = (r ^ (r >> 1)) & 1; r = (r >> 1) | (bit << 14); v = (r & 1) ? 1 : -1; }
      d[i] = v * 0.8;
    }
    return b;
  }
  function makeMetal(c) {
    const len = Math.floor(c.sampleRate * 0.5);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    let r = 1; const per = Math.max(1, Math.floor(c.sampleRate / 44000)); let v = 1;
    for (let i = 0; i < len; i++) {
      if (i % per === 0) { const bit = (r ^ (r >> 6)) & 1; r = (r >> 1) | (bit << 14); v = (r & 1) ? 1 : -1; }
      d[i] = v * 0.7;
    }
    return b;
  }

  function setup(c, opt = {}) {
    ctx = c;
    waves[0.125] = pulseWave(c, 0.125); waves[0.25] = pulseWave(c, 0.25); waves[0.5] = pulseWave(c, 0.5);
    waves.tri = nesTriWave(c);
    { const n = 12, re = new Float32Array(n), im = new Float32Array(n); im[1] = 1; im[2] = 0.08; im[3] = 0.22; im[5] = 0.06; waves.bell = c.createPeriodicWave(re, im); }
    noiseBuf = makeNoise(c); metalBuf = makeMetal(c);
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    master = c.createGain(); master.gain.value = muted ? 0 : 0.9;
    comp.connect(master); master.connect(c.destination);
    musicBus = c.createGain(); musicBus.gain.value = musicVol; musicBus.connect(comp);
    sfxBus = c.createGain(); sfxBus.gain.value = sfxVol; sfxBus.connect(comp);
    /* うたの ディレイ（ギターの やまびこ） */
    delayIn = c.createGain(); delayIn.gain.value = 0.2;
    const dl = c.createDelay(1.0); dl.delayTime.value = 0.26;
    const fb = c.createGain(); fb.gain.value = 0.28;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    delayIn.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(musicBus);
    /* きれいな 音の ための リバーブ（つくった ひびき）と ピンポン ディレイ（おんがくばこ: つかう 曲の ときだけ つくる） */
    if (opt.fx === false) { revIn = c.createGain(); ppIn = c.createGain(); return; }
    const len = Math.floor(c.sampleRate * 1.5), ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let lpv = 0; for (let i = 0; i < len; i++) { const x = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); lpv += (x - lpv) * 0.35; d[i] = lpv; } }
    revIn = c.createGain(); revIn.gain.value = 1;
    const conv = c.createConvolver(); conv.buffer = ir; const rw = c.createGain(); rw.gain.value = 0.55;
    revIn.connect(conv); conv.connect(rw); rw.connect(comp);
    ppIn = c.createGain(); ppIn.gain.value = 1;
    const dL = c.createDelay(1.5), dR = c.createDelay(1.5), fL = c.createGain(), fR = c.createGain(), pL = c.createStereoPanner(), pR = c.createStereoPanner(), plp = c.createBiquadFilter();
    dL.delayTime.value = 0.349; dR.delayTime.value = 0.349; fL.gain.value = 0.33; fR.gain.value = 0.33; pL.pan.value = -0.7; pR.pan.value = 0.7; plp.type = 'lowpass'; plp.frequency.value = 3800;
    ppIn.connect(plp); plp.connect(dL); dL.connect(pL); dL.connect(fL); fL.connect(dR); dR.connect(pR); dR.connect(fR); fR.connect(dL);
    pL.connect(comp); pR.connect(comp); pL.connect(revIn); pR.connect(revIn);
  }

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(() => {}); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { setup(new AC()); } catch (e) { return false; }
    return true;
  }

  const mf = m => 440 * Math.pow(2, (m - 69) / 12);

  /* ---------- こえ（ひとつの おと） ---------- */
  function tone(t, o) {
    /* o: {m, dur, vol, wave, bus, att, dec, sus, rel, vib, bend, slide, echo} */
    const c = ctx, osc = c.createOscillator(), g = c.createGain();
    if (o.wave === 'tri') osc.setPeriodicWave(waves.tri);
    else if (o.wave === 'sine') osc.type = 'sine';
    else osc.setPeriodicWave(waves[o.wave || 0.5]);
    const f = mf(o.m);
    if (o.bend) {
      osc.frequency.setValueAtTime(f * Math.pow(2, o.bend / 12), t);
      osc.frequency.exponentialRampToValueAtTime(f, t + 0.07);
    } else osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(mf(o.m + o.slide), t + o.dur);
    const v = o.vol, att = o.att ?? 0.004, dec = o.dec ?? 0.12, sus = o.sus ?? 0.7, rel = o.rel ?? 0.03;
    const end = t + Math.max(o.dur, att + 0.01);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + att);
    g.gain.setTargetAtTime(v * sus, t + att, dec / 3);
    g.gain.setValueAtTime(v * sus, end);
    g.gain.linearRampToValueAtTime(0.0001, end + rel);
    if (o.vib && o.dur > 0.22) {
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 5.8; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.012 * o.vib, t + 0.25);
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(end + rel + 0.02);
    }
    osc.connect(g); g.connect(o.bus || musicBus);
    if (o.echo) g.connect(delayIn);
    osc.start(t); osc.stop(end + rel + 0.02);
  }
  function noise(t, o) {
    /* o: {dur, vol, hp, bp, lp, q, metal, rate, bus} */
    const c = ctx, src = c.createBufferSource(), g = c.createGain();
    src.buffer = o.metal ? metalBuf : noiseBuf; src.loop = true;
    src.playbackRate.value = o.rate || 1;
    let node = src;
    const filt = (type, fr, q) => { const f = c.createBiquadFilter(); f.type = type; f.frequency.value = fr; if (q) f.Q.value = q; node.connect(f); node = f; };
    if (o.hp) filt('highpass', o.hp); if (o.bp) filt('bandpass', o.bp, o.q || 0.8); if (o.lp) filt('lowpass', o.lp);
    g.gain.setValueAtTime(o.vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
    node.connect(g); g.connect(o.bus || musicBus);
    src.start(t, Math.random() * 0.4); src.stop(t + o.dur + 0.02);
  }
  function kick(t, v = 0.9, bus) {
    const c = ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.11);

      if (raf) raf = requestAnimationFrame(draw);
    }
    return { setTrack, start() { if (!raf) raf = requestAnimationFrame(draw); }, stop() { cancelAnimationFrame(raf); raf = 0; }, LC, LN };
  })();

  /* ---------- ボタン ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('pp')) { e.stopPropagation(); Player.toggle(); }
  }, true);
  $('#mini-open').onclick = () => UI.now(true);
  $('#mini-next').onclick = () => Player.next();
  $('#np-close').onclick = () => UI.now(false);
  $('#np-next').onclick = () => Player.next();
  $('#np-prev').onclick = () => Player.prev();
  $('#np-tap').onclick = () => { UI.needTap(false); Player.resume(); };
  $('#np-shuf').onclick = () => { Store.d.shuffle = !Store.d.shuffle; Store.save(); const cur = Player.cur; if (cur && Player.list.length) { Player.setList(Player.list, cur); } UI.onState(); };
  $('#np-rep').onclick = () => { Store.d.repeat = { all: 'one', one: 'off', off: 'all' }[Store.d.repeat] || 'all'; Store.save(); au.loop = Store.d.repeat === 'one'; UI.onState(); };
  $('#np-fav').onclick = () => { if (!Player.cur) return; Store.toggleFav(Player.cur); UI.syncFav(); if (view === 'favs') render(); else for (const r of document.querySelectorAll('.trk')) if (r.dataset.id === Player.cur) { const f = r.querySelector('.fav'); const on = Store.isFav(Player.cur); f.classList.toggle('is', on); f.setAttribute('aria-pressed', on); } };
  const seek = $('#np-seek');
  seek.addEventListener('input', () => { seek.dragging = true; $('#np-cur').textContent = fmt(+seek.value); seek.style.setProperty('--p', (seek.value / (seek.max || 1) * 100) + '%'); });
  seek.addEventListener('change', () => { seek.dragging = false; if (Player.data) au.currentTime = +seek.value; });
  $('#set-close').onclick = () => UI.settings(false);
  $('#set').addEventListener('click', e => { if (e.target.id === 'set') UI.settings(false); const b = e.target.closest('[data-len]'); if (!b) return; Store.d.len = b.dataset.len; Store.save(); UI.settings(true); if (view !== 'home') render(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#set').hidden) UI.settings(false); else if (nowOpen) UI.now(false); }
    if (e.key === ' ' && e.target === document.body) { e.preventDefault(); Player.toggle(); }
  });
  if (navigator.audioSession) try { navigator.audioSession.type = 'playback'; } catch (e) {}

  for (const b of document.querySelectorAll('[data-icon]')) b.innerHTML = ICON[b.dataset.icon] + (b.dataset.text ? '<span>' + b.dataset.text + '</span>' : '');
  UI.onState();
  onHash();
  if (location.hash === '#now' && !Player.cur) { history.replaceState(null, '', location.pathname); onHash(); }
  window.__onbako = { Player, request, estimate, Cache, Store, UI };
})();

</script>
