<script>/* ===== PC_AU: 8bit の おと（自作の曲と こうかおん）— ろっくん1.5 の 曲を たした ばん =====
   ・曲は すべて 自作（メロディ・コードとも オリジナル）
   ・パルス波（ギター／うた）・さんかく波（ベース）・ノイズ（ドラム）
   ・ふつうの AudioContext でも OfflineAudioContext（書き出し）でも 動く */
const PC_AU = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, revIn = null, ppIn = null;
  let muted = false, musicVol = 0.55, sfxVol = 0.75;
  const waves = {};
  let noiseBuf = null, metalBuf = null;

  /* ---------- 波形 ---------- */
  function pulseWave(c, duty) {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return c.createPeriodicWave(re, im);
  }
  function nesTriWave(c) {
    /* 4bit の かいだん さんかく波（むかしの ゲームきの ベースの ざらっと した おと） */
    const N = 1024, H = 40, re = new Float32Array(H), im = new Float32Array(H);
    const s = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const p = i / N, step = Math.floor(p * 32), v = step < 16 ? step : 31 - step;
      s[i] = v / 7.5 - 1;
    }
    for (let k = 1; k < H; k++) {
      let a = 0, b = 0;
      for (let i = 0; i < N; i++) { const t = 2 * Math.PI * k * i / N; a += s[i] * Math.cos(t); b += s[i] * Math.sin(t); }
      re[k] = 2 * a / N; im[k] = 2 * b / N;
    }
    return c.createPeriodicWave(re, im);
  }
  function makeNoise(c) {
    const len = Math.floor(c.sampleRate * 1.0);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    let r = 1; /* 15bit LFSR（むかしの ゲームきの ノイズの しくみ） */
    const per = Math.max(1, Math.floor(c.sampleRate / 32000));
    let v = 1;
    for (let i = 0; i < len; i++) {
      if (i % per === 0) { const bit = (r ^ (r >> 1)) & 1; r = (r >> 1) | (bit << 14); v = (r & 1) ? 1 : -1; }
      d[i] = v * 0.8;
    }
    return b;
  }
  function makeMetal(c) {
    const len = Math.floor(c.sampleRate * 0.5);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    let r = 1; const per = Math.max(1, Math.floor(c.sampleRate / 44000)); let v = 1;
    for (let i = 0; i < len; i++) {
      if (i % per === 0) { const bit = (r ^ (r >> 6)) & 1; r = (r >> 1) | (bit << 14); v = (r & 1) ? 1 : -1; }
      d[i] = v * 0.7;
    }
    return b;
  }

  function setup(c) {
    ctx = c;
    waves[0.125] = pulseWave(c, 0.125); waves[0.25] = pulseWave(c, 0.25); waves[0.5] = pulseWave(c, 0.5);
    waves.tri = nesTriWave(c);
    { const n = 12, re = new Float32Array(n), im = new Float32Array(n); im[1] = 1; im[2] = 0.08; im[3] = 0.22; im[5] = 0.06; waves.bell = c.createPeriodicWave(re, im); }
    noiseBuf = makeNoise(c); metalBuf = makeMetal(c);
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    master = c.createGain(); master.gain.value = muted ? 0 : 0.9;
    comp.connect(master); master.connect(c.destination);
    musicBus = c.createGain(); musicBus.gain.value = musicVol; musicBus.connect(comp);
    sfxBus = c.createGain(); sfxBus.gain.value = sfxVol; sfxBus.connect(comp);
    /* うたの ディレイ（ギターの やまびこ） */
    delayIn = c.createGain(); delayIn.gain.value = 0.2;
    const dl = c.createDelay(1.0); dl.delayTime.value = 0.26;
    const fb = c.createGain(); fb.gain.value = 0.28;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    delayIn.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(musicBus);

<h2>このゲームについて</h2>
<p>『ろっくんの ピコピコ ぼうけん 〜チビの はじめての そつぎょう〜』は、歯の仲間たちが暮らす「おくちの くに」を舞台にした、8ビットの見おろし型アクションです。いちばん小さい乳歯のチビが、国でいちばん最初に「そつぎょう（歯が抜けること）」をむかえる物語で、仲間とこわさをのりこえていきます。</p>
<p>プロローグから だい5しょう・エピローグ・スタッフロールまで、約1時間の物語です。途中でやめても、場所を移ったときや章のはじめに自動で記録され、タイトルの「つづきから」で続けられます。</p>

<h2>あそびかた</h2>
<ul><li>歩く: 矢印キー（スマホは画面の左側をなぞる）。</li>
<li>みがく: Z キー（スマホは A）。押しっぱなしで「ゴシゴシ」と続けてみがきます。前に人がいるときは、話しかけます。</li>
<li>だいじょうぶ・どうぐ: X キー（スマホは B）。こわがってしゃがんだチビのそばで長押しすると、チビが立ち直り「ゆうき」がふえます。フロスを手に入れたあとは、フロスの柱の前で押すと、歯と歯のすきまをわたれます。ワンタフトブラシを手に入れたあとは、せまいすきまの前で押すと、つまったプラークをとれます。ニコが仲間になったあとは、のりのカーテンの前で押すと、チビとニコがいっしょにかみきります。だい4しょうでは、ネバネバの門の前で押すと、キバせんぱいがひきさきます。フッ素のかねのかけらを手に入れたあとは、まわりに何もないところで押すと「フッ素のバリア」が出て、上から落ちてくる「さんのしずく」をはじきます（しばらく使うと、少し休みが必要です）。</li>
<li>メニュー: Esc キーか C キー（スマホは画面右上のボタン）。「ヒント」（つぎに行く場所）・「ずかん」・「せってい」が開けます。</li>
<li>ピンクのトランポリンに乗ると、みぞを飛びこえます。「グラグラ じしん」のときは、チビのそばにいると、チビがこわがりません。</li>
<li>敵は「たおさない」しくみです。ハブラシでみがいてピカピカにすると、くせが直って帰っていきます。</li>
<li>げんき（星）が0になっても負けではありません。その場所の入口から、げんきいっぱいでやり直せます。ハブラシ スタンド（記録の場所）や、章のはじめでも、げんきがもどります。</li></ul>
<h2>歯のことについて</h2>
<p>このゲームは、歯みがきの知識を教えるためのものではありません。「乳歯は大人の歯に生えかわる」「抜けた乳歯は乳歯ケースに大事にしまわれる」ことが、物語の中の世界のきまりとして出てきます。</p>
<ul><li>このゲームは、診断や治療の代わりではありません。歯のことで気になることがあれば、歯医者さんに相談してください。</li></ul>
<h2>データについて</h2>
<ul><li>セーブ・設定・あそびの記録は、この端末のブラウザの中だけに保存します。外へ送ることはありません。</li>
<li>広告・課金・アカウント登録・外部へのリンクはありません。</li></ul>
<h2>よみあげについて</h2>
<ul><li>端末の音声読み上げ機能を使います。インターネット経由の声は使いません（日本語の声がない端末では、よみあげは働きません）。</li>
<li>イベントなど人前で Mac を使って遊ぶときは、よみあげをオフにしてください（Mac の声の使用許諾のため）。</li>
<li>「じどうで すすむ」がオンのとき（はじめからオン）、よみあげが終わると少し待って次の文へ進みます。</li>
<li>設定: タイトル または メニュー →「せってい」→「よみあげ」「じどうで すすむ」。文字の速さ・音もここで変えられます。</li></ul>
<h2>全画面で遊ぶには</h2>
<ul><li>スマホ・タブレット（Android・iPad）: 最初に画面をタップすると全画面になります（スマホは横向きに固定）。もどす操作（Android の「戻る」など）で元にもどります。</li>
<li>パソコン: タイトルの右上のボタン、または F キー。</li>
<li>どれも「せってい」→「ぜんがめん」でオン・オフできます。</li>
<li>iPhone: Safari には全画面の機能がありません。Safari の共有ボタン →「ホーム画面に追加」→ ホーム画面のアイコンから開くと、Safari のバーがない画面で遊べます。</li></ul>
<h2>健康と安全のために</h2>
<ul><li>明るい部屋で、画面から離れて遊んでください。30分くらいで休けいをはさみましょう。</li>
<li>光の点滅は、1秒に2.5回以下にしています（攻撃が当たったときや、無敵の間も点滅させず、すけるだけにしています）。</li></ul>

  function buildBeach(G) {

    for (const [x, y] of [[15, 3], [16, 3], [22, 12], [23, 12], [30, 3], [31, 4], [37, 11], [42, 3], [43, 3], [44, 12]]) g[y][x] = '#';
    for (const [x, y] of [[8, 3], [26, 12], [34, 3], [39, 12]]) g[y][x] = 'b';

    fill(g, W - 1, 3, W - 1, 12, '#'); g[7][W - 1] = ':'; g[8][W - 1] = ':';

  const GALLERY = [ /* ch: この しょうを あそび おわると みられる（-1 は はじまり） */

      ch3() { const G = A.G; window._dbg.startGame(); G.sc = null; G.party = ['rk', 'chibi', 'kiba']; Object.assign(G.flags, { m0: 1, m1: 1, m2: 1, kibaJoin: 1, floss: 1, onetuft: 1, pkDone: 1, eggDone: 1, firstDone: 1, broDone: 1, waniDone: 1, yuuki: 2, comfortTip: 1 }); A.run(ch3Start); }

      }
